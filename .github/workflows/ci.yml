name: Verificações
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: semgrep scan --error --config p/nextjs --config p/typescript src
